global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ton-tracker-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: ton-tracker-deployment
    metrics_path: /metrics
    static_configs:
      - targets: ["deployment-monitor:9101"]
  - job_name: ton-tracker-alertmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["alertmanager:9093"]
