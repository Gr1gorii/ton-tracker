groups:
  - name: ton-tracker
    rules:
      - alert: TonTrackerBackendDown
        expr: up{job="ton-tracker-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend metrics target is unavailable
      - alert: TonTrackerDatabaseNotReady
        expr: ton_tracker_database_ready == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SQLite readiness check is failing
      - alert: TonTrackerElevatedServerErrors
        expr: sum(rate(ton_tracker_http_requests_total{status=~"5.."}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Sustained backend 5xx responses detected
      - alert: TonTrackerBackupNotReady
        expr: ton_tracker_backup_monitoring_configured == 1 and ton_tracker_backup_ready == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Verified SQLite backup heartbeat is missing, stale, or invalid
      - alert: TonTrackerRecoveryDrillNotReady
        expr: ton_tracker_recovery_monitoring_configured == 1 and ton_tracker_recovery_ready == 0
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: Verified SQLite recovery drill is missing, stale, or invalid
      - alert: TonTrackerDeploymentMonitorDown
        expr: up{job="ton-tracker-deployment"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Deployment state monitor is unavailable
      - alert: TonTrackerDeploymentStateInvalid
        expr: ton_tracker_deployment_audit_valid == 0 and ton_tracker_deployment_lock_busy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Deployment receipt, journal, or ledger validation is failing
      - alert: TonTrackerDeploymentInterrupted
        expr: ton_tracker_deployment_pending_attempt == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Deployment attempt requires explicit inspection and resume
      - alert: TonTrackerDeploymentReceiptUnbound
        expr: ton_tracker_deployment_ledger_events > 0 and ton_tracker_deployment_receipt_bound == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Deployment ledger head is awaiting a matching active receipt
      - alert: TonTrackerDeploymentStateEmpty
        expr: ton_tracker_deployment_state_info{status="empty"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No successful release is recorded in deployment state
      - alert: TonTrackerDeploymentLockStuck
        expr: ton_tracker_deployment_lock_busy == 1
        for: 45m
        labels:
          severity: critical
        annotations:
          summary: Deployment lock has remained busy beyond the rollout window
      - alert: TonTrackerAlertmanagerDown
        expr: up{job="ton-tracker-alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager is unavailable to receive production alerts
      - alert: TonTrackerAlertNotificationFailures
        expr: sum(rate(alertmanager_notifications_failed_total[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager cannot deliver one or more notifications
      - alert: TonTrackerPrometheusAlertDeliveryFailures
        expr: sum(rate(prometheus_notifications_errors_total[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot deliver alerts to Alertmanager
