services:
  production-preflight:
    profiles: ["ops"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}:${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    command: ["python", "/app/ops/production_preflight.py"]
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      APP_PORT: ${APP_PORT:-8080}
      DATA_MODE: real
      TON_NETWORK: ${TON_NETWORK:-mainnet}
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io}
      TONAPI_API_KEY: ${TONAPI_API_KEY:?TONAPI_API_KEY is required}
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TONCONNECT_EXPECTED_DOMAIN: ${TONCONNECT_EXPECTED_DOMAIN:?TONCONNECT_EXPECTED_DOMAIN is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_HEALTH_MAX_AGE_SECONDS: ${BACKUP_HEALTH_MAX_AGE_SECONDS:-172800}
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-604800}
      RECOVERY_RETRY_SECONDS: ${RECOVERY_RETRY_SECONDS:-300}
      RECOVERY_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_HEALTH_MAX_AGE_SECONDS:-691200}
      RECOVERY_POINT_INTERVAL_SECONDS: ${RECOVERY_POINT_INTERVAL_SECONDS:-86400}
      RECOVERY_POINT_RETRY_SECONDS: ${RECOVERY_POINT_RETRY_SECONDS:-300}
      RECOVERY_POINT_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_POINT_HEALTH_MAX_AGE_SECONDS:-172800}
      RECOVERY_POINT_RETENTION: ${RECOVERY_POINT_RETENTION:-14}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
      ALERTMANAGER_RETENTION: ${ALERTMANAGER_RETENTION:-120h}
      ALERTMANAGER_CONFIG_FILE: /run/alertmanager/alertmanager.yml
      ALERTMANAGER_DATA_DIRECTORY: /alertmanager
      BACKEND_IMAGE: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
      FRONTEND_IMAGE: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
      DEPLOYMENT_MANIFEST_FILE: /app/deployment-manifest.json
      DEPLOYMENT_STATE_DIRECTORY: "${DEPLOYMENT_STATE_DIRECTORY:?DEPLOYMENT_STATE_DIRECTORY is required}"
      DEPLOYMENT_STATE_UID: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}"
      DEPLOYMENT_STATE_GID: "${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
      DISASTER_RECOVERY_DIRECTORY: /recovery-points
    volumes:
      - ${DEPLOYMENT_MANIFEST_FILE:?DEPLOYMENT_MANIFEST_FILE is required}:/app/deployment-manifest.json:ro
      - type: bind
        source: "${ALERTMANAGER_CONFIG_FILE:?ALERTMANAGER_CONFIG_FILE is required}"
        target: /run/alertmanager/alertmanager.yml
        read_only: true
      - type: bind
        source: "${ALERTMANAGER_DATA_DIRECTORY:?ALERTMANAGER_DATA_DIRECTORY is required}"
        target: /alertmanager
        read_only: true
      - type: bind
        source: "${DISASTER_RECOVERY_DIRECTORY:?DISASTER_RECOVERY_DIRECTORY is required}"
        target: /recovery-points
        read_only: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATA_MODE: real
      TON_NETWORK: ${TON_NETWORK:-mainnet}
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io}
      TONAPI_API_KEY: ${TONAPI_API_KEY:?TONAPI_API_KEY is required}
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      WALLET_CASE_JOB_RUNNER: disabled
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TON_LITECLIENT_TIMEOUT_SECONDS: ${TON_LITECLIENT_TIMEOUT_SECONDS:-20}
      TONCONNECT_EXPECTED_DOMAIN: ${TONCONNECT_EXPECTED_DOMAIN:?TONCONNECT_EXPECTED_DOMAIN is required}
      TONCONNECT_PROOF_TTL_SECONDS: ${TONCONNECT_PROOF_TTL_SECONDS:-900}
      BACKUP_HEALTH_FILE: /backups/.backup-health.json
      BACKUP_HEALTH_MAX_AGE_SECONDS: ${BACKUP_HEALTH_MAX_AGE_SECONDS:-172800}
      RECOVERY_HEALTH_FILE: /recovery/.recovery-health.json
      RECOVERY_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_HEALTH_MAX_AGE_SECONDS:-691200}
    volumes:
      - ton_tracker_data:/data
      - ton_tracker_backups:/backups:ro
      - ton_tracker_recovery:/recovery:ro
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      NGINX_ENVSUBST_FILTER: PUBLIC_APP_URL
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /etc/nginx/conf.d
      - /var/run

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    depends_on:
      backend:
        condition: service_healthy
      deployment-monitor:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    restart: unless-stopped
    user: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}:${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=${ALERTMANAGER_RETENTION:-120h}
      - --cluster.listen-address=
      - --enable-feature=receiver-name-in-metrics
    volumes:
      - type: bind
        source: "${ALERTMANAGER_CONFIG_FILE:?ALERTMANAGER_CONFIG_FILE is required}"
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
      - type: bind
        source: "${ALERTMANAGER_DATA_DIRECTORY:?ALERTMANAGER_DATA_DIRECTORY is required}"
        target: /alertmanager
    expose:
      - "9093"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3

  alertmanager-config-check:
    profiles: ["ops", "deployment"]
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    user: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}:${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    entrypoint: ["/bin/amtool"]
    command: ["check-config", "/etc/alertmanager/alertmanager.yml"]
    volumes:
      - type: bind
        source: "${ALERTMANAGER_CONFIG_FILE:?ALERTMANAGER_CONFIG_FILE is required}"
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  monitoring-smoke:
    profiles: ["deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/ops/check_alert_delivery.py"]
    depends_on:
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  notification-drill:
    profiles: ["deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/ops/check_alert_notification.py"]
    depends_on:
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  notification-receiver-fixture:
    profiles: ["test"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/notification_receiver_fixture.py
      - --listen
      - 0.0.0.0
      - --port
      - "9199"
    expose:
      - "9199"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9199/healthz', timeout=3).read() == b'ok\\n' else 1)"
      interval: 10s
      timeout: 5s
      start_period: 5s
      start_interval: 1s
      retries: 3

  deployment-monitor:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}:${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    command:
      - python
      - /app/ops/monitor_deployment_state.py
      - --state-directory
      - /deployment-state
      - --listen
      - 0.0.0.0
      - --port
      - "9101"
    volumes:
      - type: bind
        source: "${DEPLOYMENT_STATE_DIRECTORY:?DEPLOYMENT_STATE_DIRECTORY is required}"
        target: /deployment-state
    expose:
      - "9101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=3).read() == b'ok\\n' else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

  backup:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "/app/ops/backup_sqlite.py", "--loop"]
    environment:
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ton_tracker_data:/data:ro
      - ton_tracker_backups:/backups
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "/app/ops/backup_sqlite.py", "--healthcheck"]
      interval: 5m
      timeout: 60s
      start_period: 60s
      start_interval: 10s
      retries: 3

  backup-now:
    profiles: ["deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/ops/backup_sqlite.py"]
    environment:
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ton_tracker_data:/data:ro
      - ton_tracker_backups:/backups
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  database-bootstrap:
    profiles: ["deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/rehearse_database_bootstrap.py
      - --mode
      - fresh
    environment:
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ton_tracker_data:/data:ro
      - ton_tracker_backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  restore-drill:
    profiles: ["recovery", "deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/restore_sqlite.py
      - --heartbeat
      - /backups/.backup-health.json
      - --destination
      - /tmp/restore-drill.sqlite3
    volumes:
      - ton_tracker_backups:/backups:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  recovery-point-now:
    profiles: ["deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}:${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    command:
      - python
      - /app/ops/recovery_point.py
      - create
      - --heartbeat
      - /backups/.backup-health.json
      - --deployment-manifest
      - /app/deployment-manifest.json
      - --destination-directory
      - /recovery-points
      - --retention
      - "${RECOVERY_POINT_RETENTION:-14}"
    environment:
      RECOVERY_POINT_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_POINT_HEALTH_MAX_AGE_SECONDS:-172800}
    volumes:
      - ton_tracker_backups:/backups:ro
      - ${DEPLOYMENT_MANIFEST_FILE:?DEPLOYMENT_MANIFEST_FILE is required}:/app/deployment-manifest.json:ro
      - type: bind
        source: "${DISASTER_RECOVERY_DIRECTORY:?DISASTER_RECOVERY_DIRECTORY is required}"
        target: /recovery-points
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  recovery-point-exporter:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}:${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    command:
      - python
      - /app/ops/recovery_point.py
      - loop
      - --heartbeat
      - /backups/.backup-health.json
      - --destination-directory
      - /recovery-points
      - --retention
      - "${RECOVERY_POINT_RETENTION:-14}"
    environment:
      RECOVERY_POINT_INTERVAL_SECONDS: ${RECOVERY_POINT_INTERVAL_SECONDS:-86400}
      RECOVERY_POINT_RETRY_SECONDS: ${RECOVERY_POINT_RETRY_SECONDS:-300}
      RECOVERY_POINT_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_POINT_HEALTH_MAX_AGE_SECONDS:-172800}
    volumes:
      - ton_tracker_backups:/backups:ro
      - type: bind
        source: "${DISASTER_RECOVERY_DIRECTORY:?DISASTER_RECOVERY_DIRECTORY is required}"
        target: /recovery-points
    depends_on:
      backup:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - /app/ops/recovery_point.py
        - healthcheck
        - --destination-directory
        - /recovery-points
      interval: 6h
      timeout: 15m
      start_period: 120s
      start_interval: 10s
      retries: 3

  migration-rehearsal:
    profiles: ["deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /app/ops/rehearse_database_migration.py ]; then
          exec python /app/ops/rehearse_database_migration.py \
            --heartbeat /backups/.backup-health.json --workspace /tmp
        fi
        python /app/ops/restore_sqlite.py \
          --heartbeat /backups/.backup-health.json \
          --destination /tmp/rehearsal.sqlite3 >/dev/null
        python -m services.database_migrations >/dev/null
        python /app/ops/backup_sqlite.py \
          --verify /tmp/rehearsal.sqlite3 >/dev/null
    environment:
      TON_CHECK_DB_URL: sqlite:////tmp/rehearsal.sqlite3
    volumes:
      - ton_tracker_backups:/backups:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  recovery-watchdog:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/restore_sqlite.py
      - --loop
      - --heartbeat
      - /backups/.backup-health.json
      - --workspace
      - /tmp
      - --status-file
      - /recovery/.recovery-health.json
    environment:
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-604800}
      RECOVERY_RETRY_SECONDS: ${RECOVERY_RETRY_SECONDS:-300}
    volumes:
      - ton_tracker_backups:/backups:ro
      - ton_tracker_recovery:/recovery
    depends_on:
      backup:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - /app/ops/restore_sqlite.py
        - --healthcheck
        - --status-file
        - /recovery/.recovery-health.json
      interval: 10m
      timeout: 60s
      start_period: 120s
      start_interval: 10s
      retries: 3

volumes:
  ton_tracker_data:
  ton_tracker_backups:
  ton_tracker_recovery:
  prometheus_data:
