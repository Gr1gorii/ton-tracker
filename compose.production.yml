services:
  production-preflight:
    profiles: ["ops"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/ops/production_preflight.py"]
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      APP_PORT: ${APP_PORT:-8080}
      DATA_MODE: real
      TON_NETWORK: ${TON_NETWORK:-mainnet}
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io}
      TONAPI_API_KEY: ${TONAPI_API_KEY:?TONAPI_API_KEY is required}
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TONCONNECT_EXPECTED_DOMAIN: ${TONCONNECT_EXPECTED_DOMAIN:?TONCONNECT_EXPECTED_DOMAIN is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_HEALTH_MAX_AGE_SECONDS: ${BACKUP_HEALTH_MAX_AGE_SECONDS:-172800}
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-604800}
      RECOVERY_RETRY_SECONDS: ${RECOVERY_RETRY_SECONDS:-300}
      RECOVERY_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_HEALTH_MAX_AGE_SECONDS:-691200}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
      BACKEND_IMAGE: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
      FRONTEND_IMAGE: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
      DEPLOYMENT_MANIFEST_FILE: /app/deployment-manifest.json
      DEPLOYMENT_STATE_DIRECTORY: "${DEPLOYMENT_STATE_DIRECTORY:?DEPLOYMENT_STATE_DIRECTORY is required}"
      DEPLOYMENT_STATE_UID: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}"
      DEPLOYMENT_STATE_GID: "${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    volumes:
      - ${DEPLOYMENT_MANIFEST_FILE:?DEPLOYMENT_MANIFEST_FILE is required}:/app/deployment-manifest.json:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATA_MODE: real
      TON_NETWORK: ${TON_NETWORK:-mainnet}
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io}
      TONAPI_API_KEY: ${TONAPI_API_KEY:?TONAPI_API_KEY is required}
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TON_LITECLIENT_TIMEOUT_SECONDS: ${TON_LITECLIENT_TIMEOUT_SECONDS:-20}
      TONCONNECT_EXPECTED_DOMAIN: ${TONCONNECT_EXPECTED_DOMAIN:?TONCONNECT_EXPECTED_DOMAIN is required}
      TONCONNECT_PROOF_TTL_SECONDS: ${TONCONNECT_PROOF_TTL_SECONDS:-900}
      BACKUP_HEALTH_FILE: /backups/.backup-health.json
      BACKUP_HEALTH_MAX_AGE_SECONDS: ${BACKUP_HEALTH_MAX_AGE_SECONDS:-172800}
      RECOVERY_HEALTH_FILE: /recovery/.recovery-health.json
      RECOVERY_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_HEALTH_MAX_AGE_SECONDS:-691200}
    volumes:
      - ton_tracker_data:/data
      - ton_tracker_backups:/backups:ro
      - ton_tracker_recovery:/recovery:ro
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      NGINX_ENVSUBST_FILTER: PUBLIC_APP_URL
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /etc/nginx/conf.d
      - /var/run

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    depends_on:
      backend:
        condition: service_healthy
      deployment-monitor:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  deployment-monitor:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "${DEPLOYMENT_STATE_UID:?DEPLOYMENT_STATE_UID is required}:${DEPLOYMENT_STATE_GID:?DEPLOYMENT_STATE_GID is required}"
    command:
      - python
      - /app/ops/monitor_deployment_state.py
      - --state-directory
      - /deployment-state
      - --listen
      - 0.0.0.0
      - --port
      - "9101"
    volumes:
      - type: bind
        source: "${DEPLOYMENT_STATE_DIRECTORY:?DEPLOYMENT_STATE_DIRECTORY is required}"
        target: /deployment-state
    expose:
      - "9101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=3).read() == b'ok\\n' else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

  backup:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "/app/ops/backup_sqlite.py", "--loop"]
    environment:
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ton_tracker_data:/data:ro
      - ton_tracker_backups:/backups
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "/app/ops/backup_sqlite.py", "--healthcheck"]
      interval: 5m
      timeout: 60s
      start_period: 60s
      start_interval: 10s
      retries: 3

  backup-now:
    profiles: ["deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/ops/backup_sqlite.py"]
    environment:
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ton_tracker_data:/data:ro
      - ton_tracker_backups:/backups
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  restore-drill:
    profiles: ["recovery", "deployment"]
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/restore_sqlite.py
      - --heartbeat
      - /backups/.backup-health.json
      - --destination
      - /tmp/restore-drill.sqlite3
    volumes:
      - ton_tracker_backups:/backups:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  recovery-watchdog:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    pull_policy: ${APP_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/restore_sqlite.py
      - --loop
      - --heartbeat
      - /backups/.backup-health.json
      - --workspace
      - /tmp
      - --status-file
      - /recovery/.recovery-health.json
    environment:
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-604800}
      RECOVERY_RETRY_SECONDS: ${RECOVERY_RETRY_SECONDS:-300}
    volumes:
      - ton_tracker_backups:/backups:ro
      - ton_tracker_recovery:/recovery
    depends_on:
      backup:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - /app/ops/restore_sqlite.py
        - --healthcheck
        - --status-file
        - /recovery/.recovery-health.json
      interval: 10m
      timeout: 60s
      start_period: 120s
      start_interval: 10s
      retries: 3

volumes:
  ton_tracker_data:
  ton_tracker_backups:
  ton_tracker_recovery:
  prometheus_data:
