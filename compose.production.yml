services:
  production-preflight:
    profiles: ["ops"]
    image: "${BACKEND_IMAGE:-ghcr.io/gr1gorii/ton-tracker-backend:latest}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/ops/production_preflight.py"]
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      APP_PORT: ${APP_PORT:-8080}
      DATA_MODE: real
      TON_NETWORK: ${TON_NETWORK:-mainnet}
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io}
      TONAPI_API_KEY: ${TONAPI_API_KEY:?TONAPI_API_KEY is required}
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TONCONNECT_EXPECTED_DOMAIN: ${TONCONNECT_EXPECTED_DOMAIN:?TONCONNECT_EXPECTED_DOMAIN is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_HEALTH_MAX_AGE_SECONDS: ${BACKUP_HEALTH_MAX_AGE_SECONDS:-172800}
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-604800}
      RECOVERY_RETRY_SECONDS: ${RECOVERY_RETRY_SECONDS:-300}
      RECOVERY_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_HEALTH_MAX_AGE_SECONDS:-691200}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  backend:
    image: "${BACKEND_IMAGE:-ghcr.io/gr1gorii/ton-tracker-backend:latest}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATA_MODE: real
      TON_NETWORK: ${TON_NETWORK:-mainnet}
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io}
      TONAPI_API_KEY: ${TONAPI_API_KEY:?TONAPI_API_KEY is required}
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TON_LITECLIENT_TIMEOUT_SECONDS: ${TON_LITECLIENT_TIMEOUT_SECONDS:-20}
      TONCONNECT_EXPECTED_DOMAIN: ${TONCONNECT_EXPECTED_DOMAIN:?TONCONNECT_EXPECTED_DOMAIN is required}
      TONCONNECT_PROOF_TTL_SECONDS: ${TONCONNECT_PROOF_TTL_SECONDS:-900}
      BACKUP_HEALTH_FILE: /backups/.backup-health.json
      BACKUP_HEALTH_MAX_AGE_SECONDS: ${BACKUP_HEALTH_MAX_AGE_SECONDS:-172800}
      RECOVERY_HEALTH_FILE: /recovery/.recovery-health.json
      RECOVERY_HEALTH_MAX_AGE_SECONDS: ${RECOVERY_HEALTH_MAX_AGE_SECONDS:-691200}
    volumes:
      - ton_tracker_data:/data
      - ton_tracker_backups:/backups:ro
      - ton_tracker_recovery:/recovery:ro
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    image: "${FRONTEND_IMAGE:-ghcr.io/gr1gorii/ton-tracker-frontend:latest}"
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      NGINX_ENVSUBST_FILTER: PUBLIC_APP_URL
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /etc/nginx/conf.d
      - /var/run

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  backup:
    image: "${BACKEND_IMAGE:-ghcr.io/gr1gorii/ton-tracker-backend:latest}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "/app/ops/backup_sqlite.py", "--loop"]
    environment:
      TON_CHECK_DB_URL: sqlite:////data/ton_check.db
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ton_tracker_data:/data:ro
      - ton_tracker_backups:/backups
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "/app/ops/backup_sqlite.py", "--healthcheck"]
      interval: 5m
      timeout: 60s
      start_period: 60s
      retries: 3

  restore-drill:
    profiles: ["recovery"]
    image: "${BACKEND_IMAGE:-ghcr.io/gr1gorii/ton-tracker-backend:latest}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/restore_sqlite.py
      - --heartbeat
      - /backups/.backup-health.json
      - --destination
      - /tmp/restore-drill.sqlite3
    volumes:
      - ton_tracker_backups:/backups:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  recovery-watchdog:
    image: "${BACKEND_IMAGE:-ghcr.io/gr1gorii/ton-tracker-backend:latest}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /app/ops/restore_sqlite.py
      - --loop
      - --heartbeat
      - /backups/.backup-health.json
      - --workspace
      - /tmp
      - --status-file
      - /recovery/.recovery-health.json
    environment:
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-604800}
      RECOVERY_RETRY_SECONDS: ${RECOVERY_RETRY_SECONDS:-300}
    volumes:
      - ton_tracker_backups:/backups:ro
      - ton_tracker_recovery:/recovery
    depends_on:
      backup:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - /app/ops/restore_sqlite.py
        - --healthcheck
        - --status-file
        - /recovery/.recovery-health.json
      interval: 10m
      timeout: 60s
      start_period: 120s
      retries: 3

volumes:
  ton_tracker_data:
  ton_tracker_backups:
  ton_tracker_recovery:
  prometheus_data:
