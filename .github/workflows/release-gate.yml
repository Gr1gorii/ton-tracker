name: Release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m compileall -q backend ops
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run --testTimeout=15000
      - run: npm run build
      - run: npm audit --omit=dev

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_APP_URL: https://gram.example
      APP_PORT: "8080"
      DATA_MODE: real
      TON_NETWORK: mainnet
      TONAPI_BASE_URL: https://tonapi.io
      TONAPI_API_KEY: ci-placeholder-key-with-valid-length
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TONCONNECT_EXPECTED_DOMAIN: gram.example
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION: "14"
      BACKUP_HEALTH_MAX_AGE_SECONDS: "172800"
      RECOVERY_INTERVAL_SECONDS: "604800"
      RECOVERY_RETRY_SECONDS: "300"
      RECOVERY_HEALTH_MAX_AGE_SECONDS: "691200"
      RECOVERY_POINT_RETENTION: "14"
      RECOVERY_POINT_INTERVAL_SECONDS: "86400"
      RECOVERY_POINT_RETRY_SECONDS: "300"
      RECOVERY_POINT_HEALTH_MAX_AGE_SECONDS: "172800"
      PROMETHEUS_RETENTION: 15d
      ALERTMANAGER_RETENTION: 120h
      BACKEND_IMAGE: ghcr.io/gr1gorii/ton-tracker-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      FRONTEND_IMAGE: ghcr.io/gr1gorii/ton-tracker-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DEPLOYMENT_MANIFEST_FILE: ${{ github.workspace }}/.release-gate-deployment.json
      APP_PULL_POLICY: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.runtime.lock
      - run: python -m pip install --require-hashes -r backend/requirements.runtime.lock
      - name: Prepare private deployment state fixture
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/gram-scope-deployment-state"
          alertmanager_data="$RUNNER_TEMP/gram-scope-alertmanager"
          recovery_points="$RUNNER_TEMP/gram-scope-external-recovery"
          alertmanager_config="$RUNNER_TEMP/gram-scope-alertmanager.yml"
          mkdir -p "$state"
          mkdir -p "$alertmanager_data"
          mkdir -p "$recovery_points"
          chmod 700 "$state"
          chmod 700 "$alertmanager_data"
          chmod 700 "$recovery_points"
          python - "$alertmanager_config" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          path.write_text(
              "route:\n"
              "  receiver: ci-webhook\n"
              "  group_wait: 1s\n"
              "  group_interval: 1s\n"
              "  repeat_interval: 1h\n"
              "receivers:\n"
              "  - name: ci-webhook\n"
              "    webhook_configs:\n"
              "      - url: http://notification-receiver-fixture:9199/alerts\n"
              "        send_resolved: true\n",
              encoding="utf-8",
          )
          path.chmod(0o600)
          PY
          python ops/inspect_deployment_state.py --state-directory "$state" >/dev/null
          {
            echo "DEPLOYMENT_STATE_DIRECTORY=$state"
            echo "DEPLOYMENT_STATE_UID=$(id -u)"
            echo "DEPLOYMENT_STATE_GID=$(id -g)"
            echo "ALERTMANAGER_CONFIG_FILE=$alertmanager_config"
            echo "ALERTMANAGER_DATA_DIRECTORY=$alertmanager_data"
            echo "DISASTER_RECOVERY_DIRECTORY=$recovery_points"
          } >> "$GITHUB_ENV"
      - name: Create atomic deployment manifest fixture
        run: |
          python ops/create_release_manifest.py \
            --tag v0.71.0 \
            --source-commit "$GITHUB_SHA" \
            --backend-digest sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --frontend-digest sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --output "$DEPLOYMENT_MANIFEST_FILE"
      - run: python ops/production_preflight.py
      - run: docker compose -f compose.production.yml config --quiet
      - run: docker compose -f compose.production.yml --profile ops run --rm alertmanager-config-check
      - run: docker build --file backend/Dockerfile --tag gram-scope-backend:gate .
      - run: docker build --file frontend/Dockerfile --tag gram-scope-frontend:gate .
      - name: Smoke-test read-only production containers
        env:
          APP_PORT: "18080"
          BACKEND_IMAGE: gram-scope-backend:gate
          FRONTEND_IMAGE: gram-scope-frontend:gate
        run: |
          set -euo pipefail
          project=gram-scope-runtime-gate
          cleanup() {
            docker compose --project-name "$project" --file compose.production.yml \
              down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm database-bootstrap
          if ! docker compose --project-name "$project" --file compose.production.yml \
            up --detach --no-build --wait --wait-timeout 120 frontend; then
            docker compose --project-name "$project" --file compose.production.yml ps
            docker compose --project-name "$project" --file compose.production.yml \
              logs --no-color backend frontend
            exit 1
          fi
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm backup-now
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm restore-drill
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm migration-rehearsal
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm recovery-point-now
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm database-bootstrap \
            python /app/ops/rehearse_database_bootstrap.py --mode resume
          docker compose --project-name "$project" --file compose.production.yml \
            --profile test up --detach --no-build --wait notification-receiver-fixture
          docker compose --project-name "$project" --file compose.production.yml \
            up --detach --no-build --wait --wait-timeout 180 \
            frontend prometheus backup recovery-watchdog recovery-point-exporter \
            deployment-monitor alertmanager
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm monitoring-smoke
          docker compose --project-name "$project" --file compose.production.yml \
            --profile deployment run --rm notification-drill
          python ops/production_preflight.py \
            --smoke-url "http://127.0.0.1:${APP_PORT}" \
            --expected-public-url "$PUBLIC_APP_URL"
      - name: Validate Prometheus configuration and alerts
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/monitoring:/etc/prometheus:ro"
          prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
          check config /etc/prometheus/prometheus.yml
