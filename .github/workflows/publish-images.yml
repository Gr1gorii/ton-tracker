name: Publish release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/gr1gorii/ton-tracker-backend
            dockerfile: backend/Dockerfile
          - component: frontend
            image: ghcr.io/gr1gorii/ton-tracker-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          printf '%s' "$RELEASE_TAG" |
          grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=GRAM Scope ${{ matrix.component }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest signed build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: ${{ github.ref_name }}
          push-to-registry: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      PUBLIC_APP_URL: https://gram.example
      APP_PORT: "18080"
      APP_PULL_POLICY: always
      DATA_MODE: real
      TON_NETWORK: mainnet
      TONAPI_BASE_URL: https://tonapi.io
      TONAPI_API_KEY: ci-placeholder-key-with-valid-length
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TONCONNECT_EXPECTED_DOMAIN: gram.example
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION: "14"
      BACKUP_HEALTH_MAX_AGE_SECONDS: "172800"
      RECOVERY_INTERVAL_SECONDS: "604800"
      RECOVERY_RETRY_SECONDS: "300"
      RECOVERY_HEALTH_MAX_AGE_SECONDS: "691200"
      PROMETHEUS_RETENTION: 15d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select exact release images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_TAG" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          release=${RELEASE_TAG#v}
          {
            echo "BACKEND_IMAGE=ghcr.io/gr1gorii/ton-tracker-backend:${release}"
            echo "FRONTEND_IMAGE=ghcr.io/gr1gorii/ton-tracker-frontend:${release}"
          } >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published multi-platform manifests
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            manifest=$(mktemp)
            docker buildx imagetools inspect --raw "$image" > "$manifest"
            python - "$manifest" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          platforms = {
              (entry.get("platform", {}).get("os"), entry.get("platform", {}).get("architecture"))
              for entry in payload.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          missing = required - platforms
          if missing:
              raise SystemExit(f"release manifest is missing platforms: {sorted(missing)}")
          PY
            rm -f "$manifest"
          done
      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            gh attestation verify "oci://${image}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/publish-images.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Pull and smoke-test exact release images
        run: |
          set -euo pipefail
          project=gram-scope-published-release
          cleanup() {
            docker compose --project-name "$project" --file compose.production.yml \
              down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --project-name "$project" --file compose.production.yml \
            config --quiet
          docker compose --project-name "$project" --file compose.production.yml \
            pull backend frontend
          if ! docker compose --project-name "$project" --file compose.production.yml \
            up --detach --no-build --wait --wait-timeout 120 frontend; then
            docker compose --project-name "$project" --file compose.production.yml ps
            docker compose --project-name "$project" --file compose.production.yml \
              logs --no-color backend frontend
            exit 1
          fi
          python ops/production_preflight.py \
            --smoke-url "http://127.0.0.1:${APP_PORT}" \
            --expected-public-url "$PUBLIC_APP_URL"
