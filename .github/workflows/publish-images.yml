name: Publish release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/gr1gorii/ton-tracker-backend
            dockerfile: backend/Dockerfile
          - component: frontend
            image: ghcr.io/gr1gorii/ton-tracker-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          printf '%s' "$RELEASE_TAG" |
          grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=GRAM Scope ${{ matrix.component }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest signed build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: ${{ github.ref_name }}
          push-to-registry: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PUBLIC_APP_URL: https://gram.example
      APP_PORT: "18080"
      APP_PULL_POLICY: always
      DATA_MODE: real
      TON_NETWORK: mainnet
      TONAPI_BASE_URL: https://tonapi.io
      TONAPI_API_KEY: ci-placeholder-key-with-valid-length
      WALLET_ACTIVITY_PROVIDER: tonapi
      WALLET_ACTIVITY_LIVE_ENABLED: "true"
      TON_LITECLIENT_TRUST_LEVEL: "0"
      TONCONNECT_EXPECTED_DOMAIN: gram.example
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION: "14"
      BACKUP_HEALTH_MAX_AGE_SECONDS: "172800"
      RECOVERY_INTERVAL_SECONDS: "604800"
      RECOVERY_RETRY_SECONDS: "300"
      RECOVERY_HEALTH_MAX_AGE_SECONDS: "691200"
      PROMETHEUS_RETENTION: 15d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select exact release images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_TAG" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          release=${RELEASE_TAG#v}
          {
            echo "BACKEND_IMAGE=ghcr.io/gr1gorii/ton-tracker-backend:${release}"
            echo "FRONTEND_IMAGE=ghcr.io/gr1gorii/ton-tracker-frontend:${release}"
          } >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published multi-platform manifests
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            manifest=$(mktemp)
            docker buildx imagetools inspect "$image" \
              --format '{{json .Manifest}}' > "$manifest"
            digest=$(python - "$manifest" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          digest = payload.get("digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("release manifest index digest is invalid")
          platforms = {
              (entry.get("platform", {}).get("os"), entry.get("platform", {}).get("architecture"))
              for entry in payload.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          missing = required - platforms
          if missing:
              raise SystemExit(f"release manifest is missing platforms: {sorted(missing)}")
          print(digest)
          PY
            )
            if [ "$image" = "$BACKEND_IMAGE" ]; then
              echo "BACKEND_DIGEST=$digest" >> "$GITHUB_ENV"
            elif [ "$image" = "$FRONTEND_IMAGE" ]; then
              echo "FRONTEND_DIGEST=$digest" >> "$GITHUB_ENV"
            else
              exit 1
            fi
            rm -f "$manifest"
          done
      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            gh attestation verify "oci://${image}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/publish-images.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Generate immutable deployment manifest
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/gram-scope-${GITHUB_REF_NAME}-deployment.json"
          python ops/create_release_manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --backend-digest "$BACKEND_DIGEST" \
            --frontend-digest "$FRONTEND_DIGEST" \
            --output "$manifest"
          checksum="${manifest}.sha256"
          manifest_dir=$(dirname "$manifest")
          manifest_name=$(basename "$manifest")
          (
            cd "$manifest_dir"
            sha256sum "$manifest_name" > "${manifest_name}.sha256"
          )
          {
            echo "DEPLOYMENT_MANIFEST=$manifest"
            echo "DEPLOYMENT_CHECKSUM=$checksum"
            echo "DEPLOYMENT_MANIFEST_FILE=$manifest"
          } >> "$GITHUB_ENV"
      - id: attest-deployment-manifest
        name: Attest deployment manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ env.DEPLOYMENT_MANIFEST }}
      - name: Pull and smoke-test exact release images
        run: |
          set -euo pipefail
          project=gram-scope-published-release
          cleanup() {
            docker compose --project-name "$project" --file compose.production.yml \
              down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --project-name "$project" --file compose.production.yml \
            config --quiet
          docker compose --project-name "$project" --file compose.production.yml \
            pull backend frontend
          if ! docker compose --project-name "$project" --file compose.production.yml \
            up --detach --no-build --wait --wait-timeout 120 frontend; then
            docker compose --project-name "$project" --file compose.production.yml ps
            docker compose --project-name "$project" --file compose.production.yml \
              logs --no-color backend frontend
            exit 1
          fi
          python ops/production_preflight.py \
            --smoke-url "http://127.0.0.1:${APP_PORT}" \
            --expected-public-url "$PUBLIC_APP_URL"
      - name: Publish verified deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest-deployment-manifest.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/gram-scope-${RELEASE_TAG}-deployment.intoto.jsonl"
          cp "$ATTESTATION_BUNDLE" "$bundle"
          manifest_name=$(basename "$DEPLOYMENT_MANIFEST")
          checksum_name=$(basename "$DEPLOYMENT_CHECKSUM")
          bundle_name=$(basename "$bundle")
          python ops/verify_release_bundle.py \
            --manifest "$DEPLOYMENT_MANIFEST" \
            --checksum "$DEPLOYMENT_CHECKSUM" \
            --attestation-bundle "$bundle" \
            --tag "$RELEASE_TAG" >/dev/null
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            gh release download "$RELEASE_TAG" \
              --pattern "$manifest_name" \
              --pattern "$checksum_name" \
              --pattern "$bundle_name" \
              --dir "$existing"
            cmp "$DEPLOYMENT_MANIFEST" "$existing/$manifest_name"
            cmp "$DEPLOYMENT_CHECKSUM" "$existing/$checksum_name"
            python ops/verify_release_bundle.py \
              --manifest "$existing/$manifest_name" \
              --checksum "$existing/$checksum_name" \
              --attestation-bundle "$existing/$bundle_name" \
              --tag "$RELEASE_TAG" >/dev/null
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "${DEPLOYMENT_MANIFEST}#Digest-pinned deployment manifest" \
            "${DEPLOYMENT_CHECKSUM}#Deployment manifest SHA-256" \
            "${bundle}#Signed deployment manifest attestation" \
            --verify-tag \
            --title "GRAM Scope ${RELEASE_TAG}" \
            --notes "Verified multi-platform images, signed provenance, immutable deployment references, and a successful runtime smoke test."
